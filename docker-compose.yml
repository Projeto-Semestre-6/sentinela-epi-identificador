services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: sentinela-backend:latest
    container_name: sentinela-backend
    restart: unless-stopped
    expose:
      - "8000"
    ports:
      - "8000:8000"
    environment:
      # Ajuste para produção: defina as origens permitidas separadas por vírgula
      # Ex: ALLOWED_ORIGINS=https://sentinela.suaempresa.com
      ALLOWED_ORIGINS: "*"
      # Serviço de processamento de imagens (epi-computer-vision-genai, porta 8001).
      # Vazio desliga a integração. Falha no serviço = usa a imagem original.
      IMGPROC_URL: "http://host.docker.internal:8001"
      IMGPROC_TECHNIQUE: "none"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 180s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: sentinela-frontend:latest
    container_name: sentinela-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
